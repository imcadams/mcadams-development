name: Deploy static site

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload immutable assets
        run: >-
          aws s3 sync build/client s3://${{ secrets.AWS_S3_BUCKET }}/
          --delete
          --exclude "*"
          --include "assets/*"
          --cache-control "public,max-age=31536000,immutable"
      - name: Upload HTML and crawler resources
        run: >-
          aws s3 sync build/client s3://${{ secrets.AWS_S3_BUCKET }}/
          --exclude "assets/*"
          --cache-control "public,max-age=0,s-maxage=300,stale-while-revalidate=86400"
      - name: Invalidate mutable CloudFront documents
        run: >-
          aws cloudfront create-invalidation
          --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
          --paths "/" "/*.html" "/robots.txt" "/sitemap.xml" "/llms.txt" "/404.html"
